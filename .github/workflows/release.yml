name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v2026.11.18-r2145"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Validate explicit tag and refuse duplicate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d{4}\.\d{1,2}\.\d{1,2}-r\d{4}$') {
            throw "Invalid release version: $env:RELEASE_VERSION"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_VERSION"
          $response = Invoke-WebRequest -Uri $uri -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "CompactRS-Release-CI"
          } -SkipHttpErrorCheck
          if ($response.StatusCode -ne 404) {
            throw "Release already exists or lookup failed (HTTP $($response.StatusCode)); refusing to overwrite."
          }
          Write-Host "Confirmed new release: $env:RELEASE_VERSION"

      - name: Build Windows x64 (static CRT; no UPX)
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo +nightly build --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/compactrs.exe dist/compactrs.exe
          if ((Get-Item dist/compactrs.exe).Length -lt 100000) {
            throw "Unexpectedly small binary; aborting release"
          }

      - name: Write change notes and SHA256
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $hash = (Get-FileHash dist/compactrs.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = [math]::Round((Get-Item dist/compactrs.exe).Length / 1KB, 1)
          $commit = $env:GITHUB_SHA
          $notes = @"
          # CompactRS $env:RELEASE_VERSION

          Windows x64 portable WOF directory compressor — rampageX fork.

          ## Changes
          - Explorer multi-folder selection now prompts for UAC only once; prevents recursive elevation and process storms.
          - Normal mode consolidates selected directories into a single processing queue.
          - Dialog mode consolidates multiple folders into one window and processes them serially (multithreading within an individual folder remains enabled).
          - Dialog progress history stacks up to five recent folder results, with a top ellipsis for older results.
          - Dark selection highlights for the main file queue and no white header strip in Debug Console.
          - Windows process-level regression tests cover simulated UAC, IPC handoff and serial execution for 2 and 7 folders.

          ## Download
          - compactrs.exe: Windows x64 executable, normal/uncompressed (no UPX).

          ## Validation
          - Windows 11 functionality and UI: user-tested and approved.
          - Windows Server 2022 / Rust nightly: release build and mock UAC/process regression passed.
          - Real Windows UAC cannot be interacted with in GitHub hosted CI.

          Build commit: $commit
          Size: $size KiB
          SHA256: $hash

          Installation: Replace the old executable at the same path; retain compactrs.dat.
          "@
          $notes | Set-Content -Path dist/RELEASE_NOTES.md -Encoding utf8
          Write-Host "SHA256 $hash"

      - name: Create public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: CompactRS ${{ inputs.version }}
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
          draft: false
          prerelease: false
          files: dist/compactrs.exe
          fail_on_unmatched_files: true

      - name: Archive executable from exact release build
        uses: actions/upload-artifact@v4
        with:
          name: compactrs-windows-x64
          path: dist/compactrs.exe
          if-no-files-found: error
