name: CompactRS Windows x64 Release (automatic timestamp tag)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: compactrs-release
  cancel-in-progress: false

jobs:
  publish:
    # Manual release is always available. A one-time approved merge commit can
    # also initiate a release without opening a second Actions workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'release: auto [publish-compactrs]')
    runs-on: windows-2022
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Generate tag in China Standard Time and refuse collisions
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sample = [datetime]::SpecifyKind([datetime]::new(2026,11,18,13,45,0), [DateTimeKind]::Utc)
          $actual = & ./scripts/generate-release-version.ps1 -UtcNow $sample
          if ($actual -ne "v2026.11.18-r2145") { throw "Timestamp generator self-test failed: $actual" }
          $midnight = [datetime]::SpecifyKind([datetime]::new(2026,11,18,16,5,0), [DateTimeKind]::Utc)
          $actual2 = & ./scripts/generate-release-version.ps1 -UtcNow $midnight
          if ($actual2 -ne "v2026.11.19-r0005") { throw "Timezone/day boundary test failed: $actual2" }

          $version = & ./scripts/generate-release-version.ps1
          if ($version -notmatch '^v\d{4}\.\d{1,2}\.\d{1,2}-r(?:[01][0-9]|2[0-3])[0-5][0-9]$') {
            throw "Invalid generated tag: $version"
          }
          $matchingTags = @(git ls-remote --tags origin "refs/tags/$version")
          if ($LASTEXITCODE -ne 0) { throw "Failed to query remote tags" }
          if ($matchingTags.Count -gt 0) { throw "Release tag $version already exists. Retry after one minute; never overwrite." }
          "tag=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release tag (UTC+08:00): $version"

      - name: Compile portable Windows x64 (static CRT, no UPX)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.tag }}
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          $ErrorActionPreference = "Stop"
          cargo +nightly build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust compilation failed" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/compactrs.exe dist/compactrs.exe
          if ((Get-Item dist/compactrs.exe).Length -lt 100000) { throw "Unexpectedly small executable" }

      - name: Create release notes and verify embedded version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $hash = (Get-FileHash dist/compactrs.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = [math]::Round((Get-Item dist/compactrs.exe).Length / 1KB, 1)
          $commit = $env:GITHUB_SHA
          # The build embeds APP_VERSION; both tag and binary come from the
          # same generated output and the same source revision.
          $notes = @"
          # CompactRS $env:RELEASE_TAG

          Windows x64 portable WOF/NTFS compressor · rampageX fork

          ## Changes
          - Fixed unreadable black checkbox text in dark mode: Force, Case Sensitive, Regex, and Settings/Diagnostics captions now use a readable light foreground.
          - Fixed stale Settings panel colors when switching between dark and light themes without reopening the dialog.
          - Online update checks the rampageX fork only, compares numeric release dates/times and never offers older versions.
          - Update download checks GitHub's SHA256 digest before replacing the EXE, retains .old backup, and attempts rollback on replacement or relaunch failure.
          - Preserved single UAC consent for Explorer multiselection, normal batch queue, serial Dialog processing, and rolling five-folder progress stack.

          ## Download
          - compactrs.exe: Windows x64 portable executable, no UPX.

          ## Verification
          - Dark checkbox and live theme switching accepted on Windows 11.
          - Windows CI verified native dark checkbox GDI pixel rendering, updater's live fork Release API and SHA256 integrity, and Explorer 2/7-folder simulated-UAC serial regressions.
          - Real future-version update installation has not been simulated.
          - The application intentionally retains its current administrator requirement.

          Build commit: $commit
          Binary size: $size KiB
          SHA256: $hash

          Installation: Replace compactrs.exe at its original location. Preserve compactrs.dat.
          "@
          $notes | Set-Content dist/RELEASE_NOTES.md -Encoding utf8
          Write-Host "SHA256 $hash"

      - name: Publish exact version to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CompactRS ${{ steps.version.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          files: dist/compactrs.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Archive exact release executable
        uses: actions/upload-artifact@v4
        with:
          name: compactrs-windows-x64-${{ steps.version.outputs.tag }}
          path: dist/compactrs.exe
          if-no-files-found: error
