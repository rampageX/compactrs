name: Publish accepted CompactRS v2026.11.18-r2145

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-once:
    # Only the user-approved PR #2 merge may trigger this release.
    if: startsWith(github.event.head_commit.message, 'release: v2026.11.18-r2145 [publish-r2145]')
    runs-on: windows-2022
    env:
      RELEASE_VERSION: v2026.11.18-r2145
    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Refuse duplicate tag
        shell: pwsh
        run: |
          $tags = @(git tag --list $env:RELEASE_VERSION)
          if ($tags.Count -ne 0) { throw "Release tag already exists; refusing to overwrite." }
      - name: Build Windows x64 uncompressed EXE
        shell: pwsh
        env:
          APP_VERSION: v2026.11.18-r2145
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo +nightly build --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/compactrs.exe dist/compactrs.exe
          if ((Get-Item dist/compactrs.exe).Length -lt 100000) {
            throw "Invalid binary size"
          }
      - name: Write release notes with SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/compactrs.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = [math]::Round((Get-Item dist/compactrs.exe).Length / 1KB, 1)
          $sha = $env:GITHUB_SHA
          $notes = @"
          # CompactRS v2026.11.18-r2145

          Windows x64 portable WOF directory compressor — rampageX fork.

          ## Improvements
          - Multiple Explorer-selected folders request UAC only once; prevents recursive elevation and suspended-process storms.
          - Normal mode: one processing queue for selected folders.
          - Dialog mode: a single progress window and strictly serial directory processing; parallel workers inside each directory are preserved.
          - Dialog history: stacked results for up to five recent folders, older results indicated with a centered ellipsis.
          - Dark selection highlight in the main queue; removed the white blank header strip in Debug Console.
          - Windows CI regressions: 2 and 7 directories, simulated UAC, IPC delivery and serial processing.

          ## Download
          - compactrs.exe — Windows x64 portable, original uncompressed build (no UPX).

          ## Verification
          - Windows 11: real Explorer UAC, queue, Dialog and dark UI confirmed by user.
          - Windows Server 2022: Rust nightly release build and simulated-UAC process tests passed.
          - Actual UAC secure-desktop consent is not exercised in CI.

          Build commit: $sha
          Binary size: $size KiB
          SHA256: $hash

          Installation: Replace the old executable at the same path; preserve compactrs.dat.
          "@
          $notes | Set-Content dist/RELEASE_NOTES.md -Encoding utf8
          Write-Host "SHA256: $hash"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.11.18-r2145
          target_commitish: ${{ github.sha }}
          name: CompactRS v2026.11.18-r2145
          body_path: dist/RELEASE_NOTES.md
          files: dist/compactrs.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
      - name: Archive release build
        uses: actions/upload-artifact@v4
        with:
          name: compactrs-v2026.11.18-r2145-x64
          path: dist/compactrs.exe
          if-no-files-found: error
