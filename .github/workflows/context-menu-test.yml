name: Explorer single-UAC / Dialog serial smoke test
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/explorer-single-uac-serial-dialog
      - feature/dark-selection-dialog-stack
      - fix/fork-updater-dark-controls
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Build test binary (no release, no UPX)
        shell: pwsh
        run: cargo +nightly build --release --target x86_64-pc-windows-msvc
        env:
          APP_VERSION: v2026.11.18-r2145-test
          RUSTFLAGS: "-C target-feature=+crt-static"
      - uses: actions/upload-artifact@v4
        with:
          name: CompactRS-shell-batch-test-x64
          path: target/x86_64-pc-windows-msvc/release/compactrs.exe
          if-no-files-found: error
      - name: Build CI-only mock UAC variant
        shell: pwsh
        run: cargo +nightly build --release --features shell-broker-smoke --target x86_64-pc-windows-msvc
        env:
          APP_VERSION: v2026.11.18-shell-mock
          RUSTFLAGS: "-C target-feature=+crt-static"
      - name: Exercise Windows Explorer broker and Dialog serial queue
        shell: pwsh
        run: ./scripts/smoke-shell-broker.ps1
      - name: Verify updater metadata, version ordering and real Windows SHA256
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/compactrs.exe"
          # GUI subsystem apps do not reliably set PowerShell's $LASTEXITCODE.
          # Start-Process -Wait gives the actual child exit code.
          $test = Start-Process -FilePath $exe -ArgumentList "--selftest-updater" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Updater self-test failed with exit code $($test.ExitCode)" }
          Write-Host "PASS: fork updater parser, version ordering, and CryptoAPI SHA256."
      - name: Live fork Release API and asset SHA256 verification (no installation)
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/compactrs.exe"
          $test = Start-Process -FilePath $exe -ArgumentList "--selftest-updater-live" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "GitHub live updater test failed with code $($test.ExitCode)" }
          Write-Host "PASS: fork latest release API, EXE download and SHA256 digest."
      - name: Verify painted dark checkbox captions with native Windows GDI
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/compactrs.exe"
          $env:COMPACTRS_MOCK_LOG = "$env:RUNNER_TEMP\compactrs-caption-test.log"
          $test = Start-Process -FilePath $exe -ArgumentList "--selftest-dark-checkbox" -Wait -PassThru
          if (Test-Path $env:COMPACTRS_MOCK_LOG) { Get-Content $env:COMPACTRS_MOCK_LOG }
          if ($test.ExitCode -ne 0) { throw "Native checkbox paint regression failed ($($test.ExitCode))" }
          Write-Host "PASS: actual Windows dark checkbox caption pixels, native check state, dark/light toggling."
